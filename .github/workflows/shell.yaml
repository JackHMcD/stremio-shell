name: Build Stremio for Debian

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    # Using a Debian container ensures the compiled binary uses Debian's libc,
    # making it perfectly compatible with Debian systems.
    container: debian:trixie 

    steps:
      - name: Install Git (Required for Checkout)
        run: |
          apt-get update
          apt-get install -y git ca-certificates

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # If you are running this in your own repo to build the official source,
          # keep the 'repository' key. If you are running this inside a fork 
          # of stremio-shell, you can remove the 'repository' line entirely.
          repository: 'Stremio/stremio-shell'
          submodules: recursive
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkgconf g++ cmake \
            qt5-qmake qtbase5-dev qtdeclarative5-dev \
            libssl-dev librsvg2-bin libmpv-dev \
            libqt5webview5-dev qtwebengine5-dev libqt5opengl5-dev \
            qml-module-qtwebchannel qml-module-qt-labs-platform \
            qml-module-qtwebengine qml-module-qtquick-dialogs \
            qml-module-qtquick-controls qml-module-qt-labs-settings \
            qml-module-qt-labs-folderlistmodel \
            nodejs wget

      - name: Generate Makefiles (qmake)
        run: qmake

      - name: Compile Stremio
        # Stremio uses a specific makefile for release builds
        run: make -f release.makefile

      - name: Prepare Streaming Server
        # Stremio requires the streaming server and node runtime to be packaged 
        # in the build directory alongside the compiled binary.
        run: |
          cp ./server.js ./build/
          # Copy the node binary instead of symlinking so the artifact works out-of-the-box
          cp $(which node) ./build/node

      - name: Build Debian Package
        run: |
          # 1. Create the standard Debian package directory structure
          mkdir -p deb-package/opt/stremio
          mkdir -p deb-package/usr/bin
          mkdir -p deb-package/DEBIAN

          # 2. Move the compiled binary and node server into /opt
          cp build/stremio build/server.js build/node deb-package/opt/stremio/
          chmod +x deb-package/opt/stremio/stremio deb-package/opt/stremio/node

          # 3. Create a symlink so typing 'stremio' in the shell launches it
          ln -s /opt/stremio/stremio deb-package/usr/bin/stremio

          # 4. Generate the control file with package metadata
          # Note: The Depends line includes the runtime libraries (not the -dev versions)
          cat <<EOF > deb-package/DEBIAN/control
          Package: stremio
          Version: 4.4.0
          Architecture: amd64
          Maintainer: Stremio Build
          Description: Stremio video streaming application
          Depends: libqt5opengl5, libmpv2, qml-module-qtwebengine, qml-module-qtwebchannel
          EOF

          chmod 755 deb-package/DEBIAN

          # 5. Compile the directory into a .deb file
          dpkg-deb --build deb-package stremio-trixie.deb

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stremio-debian-installer
          # Tell GitHub to upload the specific .deb file we just created
          path: stremio-trixie.deb
          retention-days: 7

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stremio-debian-build
          path: build/
          retention-days: 7
