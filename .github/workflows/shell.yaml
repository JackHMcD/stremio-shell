name: Build Stremio for Debian Trixie

on:
  workflow_dispatch: # Allows you to trigger the build manually from the Actions tab
  push:
    branches:
      - main

jobs:
  build-deb:
    runs-on: ubuntu-latest
    # Run the entire job inside a Debian Trixie environment
    container:
      image: debian:trixie

    steps:
      - name: Update apt & install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git qtcreator qt5-qmake g++ pkgconf libssl-dev librsvg2-bin \
            libmpv-dev libqt5webview5-dev qtwebengine5-dev \
            nodejs make dpkg-dev cmake wget ca-certificates
            
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: stremio-shell
          
      - name: Build Stremio
        working-directory: ./stremio-shell
        run: |
          /usr/lib/qt5/bin/qmake
          make -f release.makefile

      - name: Prepare Streaming Server (NodeJS)
        # Translated from Step 5
        working-directory: ./stremio-shell
        run: |
          cp ./server.js ./build/
          ln -s /usr/bin/node ./build/node

      - name: Construct Debian Package Structure
        working-directory: ./stremio-shell
        run: |
          # Create standard Linux file hierarchy
          mkdir -p package/opt/stremio
          mkdir -p package/usr/bin
          mkdir -p package/usr/share/applications
          mkdir -p package/DEBIAN

          # Move all build artifacts into /opt/stremio
          cp -r build/* package/opt/stremio/

          # Symlink the binary so users can launch it from the terminal
          ln -s /opt/stremio/stremio package/usr/bin/stremio

          # Generate the DEBIAN/control file
          # The 'Depends' line translates Step 6 (runtime dependencies) so apt automatically installs them
          cat <<EOF > package/DEBIAN/control
          Package: stremio
          Version: 4.4.0-${{ github.run_number }}
          Architecture: amd64
          Maintainer: GitHub Actions
          Section: video
          Priority: optional
          Depends: nodejs, qml-module-qtwebchannel, qml-module-qt-labs-platform, qml-module-qtwebengine, qml-module-qtquick-dialogs, qml-module-qtquick-controls, qtdeclarative5-dev, qml-module-qt-labs-settings, qml-module-qt-labs-folderlistmodel, libmpv2 | libmpv-client
          Description: Stremio Shell (Debian Trixie)
           Modern media center that gives you the freedom to watch everything you want.
          EOF

          # Create a desktop shortcut for the app grid/launcher
          cat <<EOF > package/usr/share/applications/stremio.desktop
          [Desktop Entry]
          Name=Stremio
          Exec=/usr/bin/stremio
          Terminal=false
          Type=Application
          Categories=AudioVideo;Video;Player;
          EOF

      - name: Build .deb package
        working-directory: ./stremio-shell
        run: dpkg-deb --build package stremio-trixie.deb

      - name: Upload .deb Artifact
        # Uploads the compiled .deb so you can download it from the GitHub Actions UI
        uses: actions/upload-artifact@v4
        with:
          name: stremio-debian-trixie
          path: ./stremio-shell/stremio-trixie.deb
